[package]
name = "k-angel-board"
edition = "2024"
rust-version = "1.88"
version = "0.0.0"

[[bin]]
name = "k-angel-board"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32", "unstable"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
critical-section = "1.2.0"
esp-println = { version = "0.17.0", features = ["esp32"] }
esp-backtrace = { version = "0.19.0", features = ["esp32", "panic-handler", "println"] }
esp-radio = { version = "0.18.0", features = ["esp32", "ble", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32", "embassy", "esp-alloc", "esp-radio"] }
esp-alloc = "0.10.0"
# esp-radio 0.18.0 依赖 bt-hci 0.8，必须匹配 trouble-host 0.6.0（0.7.0 用 bt-hci 0.9 会冲突）
trouble-host = "0.6.0"
embassy-executor = "0.10"
# trouble-host 0.6.0 用 embassy-sync 0.7，必须与其一致（否则 GATT 宏的 RawMutex 约束不满足）
embassy-sync = "0.7"
embassy-time = "0.5"
embassy-futures = "0.1"
static_cell = "2.1"
# BLE 消息用 prost 编解码（no_std，定义见 proto/display.proto）
prost = { version = "0.14", default-features = false, features = ["derive"] }
# GATT 特征值改用变长类型（heapless::Vec），承载 protobuf 变长载荷
heapless = "0.9"

[build-dependencies]
# 构建时把 proto/display.proto 编译成 Rust（protoc 用自带二进制，无需系统安装）
prost-build = "0.14"
protoc-bin-vendored = "3"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2 # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
